<!DOCTYPE html>
<html lang="fr">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <title>Gestion de commande</title>

        <link rel="stylesheet" href="style.css">
    </head>

    <body>
        <main class="container">
            <h1>Gestion de commande</h1>

            <p class="intro">Passez votre commande auprès de notre assistant.</p>

            <!-- Conversation -->
            <section class="conversation-section">

                <h2>Conversation</h2>

                <div id="conversation" class="conversation">

                    <div class="message assistant-message">
                        <strong>Assistant :</strong>
                        <span>
                            Bonjour ! Que souhaitez-vous commander ?
                        </span>
                    </div>

                </div>
            </section>

            <form id="order-form">
                <div class="form-group">
                    <br/>
                    <label for="message">Votre demande</label>

                    <textarea
                        id="message"
                        name="message"
                        rows="4"
                        placeholder="Ex : Je voudrais commander 3 ordinateurs portables."
                        required
                    ></textarea>
                </div>
                <button type="submit" id="submit-button">
                    Passer la commande
                </button>
            </form>

            <div id="typing-indicator" class="typing-indicator" hidden>
                <span></span>
                <span></span>
                <span></span>
                <span>Assistant en train de réfléchir...</span>
            </div>

            <!-- Résultat final -->
            <section  id="order-result" class="response-section" hidden>

                <h2>Commande - Réponse de l'assistant</h2>

                <div id="response">Votre commande apparaîtra ici.</div>

            </section>
        </main>
        <script src="app.js"></script>
    </body>
</html>
